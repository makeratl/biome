<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biome — Live Tournament</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Spectator-only layout. The bracket (.bt-*) and badge styling come from
       style.css; everything here is page chrome + the board mirror. */
    :root { --spec-gap: 18px; }
    html, body { height: 100%; }
    body {
      margin: 0; overflow: hidden;
      background: radial-gradient(1200px 800px at 50% -10%, #16243a 0%, #0a0f17 60%, #070a10 100%);
      color: #e8eef6; font-family: 'Inter', system-ui, sans-serif;
    }
    .spec { display: flex; flex-direction: column; height: 100vh; padding: var(--spec-gap); box-sizing: border-box; gap: var(--spec-gap); }

    /* Header */
    .spec-top { display: flex; align-items: center; gap: 16px; flex: none; }
    .spec-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
    .spec-title b { color: #4fd1c5; }
    .spec-sub { font-size: 12px; opacity: .6; letter-spacing: 1px; }
    .spec-pill {
      margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; letter-spacing: 1px; padding: 6px 12px; border-radius: 999px;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    }
    .spec-dot { width: 9px; height: 9px; border-radius: 50%; background: #2ecc71; box-shadow: 0 0 10px #2ecc71; animation: specpulse 1.4s infinite; }
    .spec-pill.off .spec-dot { background: #e74c3c; box-shadow: none; animation: none; }
    @keyframes specpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

    /* Live layout: board left, hero + bracket right (grid areas so it can
       reflow to a single stacked column on phones). */
    .spec-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--spec-gap); min-height: 0; }
    .spec-body.live {
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "board hero" "board bracket";
    }
    .spec-body.live .hero-card { grid-area: hero; }
    .spec-body.live .board-panel { grid-area: board; }
    .spec-body.live .bracket-panel { grid-area: bracket; }
    .spec-body.idle { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
    .panel {
      background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px; padding: 16px; min-height: 0; display: flex; flex-direction: column;
    }
    .panel-label { font-size: 11px; letter-spacing: 2px; opacity: .5; margin-bottom: 10px; text-transform: uppercase; flex: none; }

    /* Board mirror */
    .board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    #board-img { max-width: 100%; max-height: 100%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    .board-empty { opacity: .35; font-size: 14px; }

    /* Live hero card — its own card now (top-right on desktop, first on mobile) */
    .hero { min-height: 0; display: flex; flex-direction: column; justify-content: center; }
    .hero-tag { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #e8eef6; }
    .hero-tag .spec-dot { background: #ff8c42; box-shadow: 0 0 10px #ff8c42; }
    .hero-fighters { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .hero-side { flex: 1; min-width: 0; }
    .hero-side.p2 { text-align: right; }
    .hero-name { font-size: 19px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-elo { font-size: 12px; opacity: .55; }
    .hero-score { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .hero-vs { font-size: 13px; opacity: .4; font-weight: 700; }
    .hero-bar { height: 8px; border-radius: 999px; margin-top: 10px; overflow: hidden; background: rgba(255,140,66,.25); }
    .hero-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #4fd1c5, #4fd1c5); }
    .lead .hero-score { color: #4fd1c5; }

    /* ── Fighter cockpit: two pods + move clock, VS-screen mid-fight ───────── */
    .ck-live { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: #ff8c42; }
    .ck-meta { opacity: .6; font-weight: 600; }
    .ck-ph { margin-left: auto; font-weight: 800; letter-spacing: .5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; }
    .ck-ph-p1 { color: #4fd1c5; background: rgba(79,209,197,.13); }
    .ck-ph-p2 { color: #ff8c42; background: rgba(255,140,66,.13); }
    .ck-ph-sim { color: #bfe0ff; background: rgba(120,200,255,.12); animation: sim-pulse 1.4s ease-in-out infinite; }
    @keyframes sim-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

    .cockpit { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; margin-top: 12px; }
    .cockpit-vs { align-self: center; font-size: 13px; font-weight: 800; opacity: .35; letter-spacing: 1px; }
    .pod { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 4px; border-radius: 14px;
      transition: opacity .35s ease, background .35s ease; }
    .pod.dim { opacity: .4; }
    .pod.active { background: rgba(255,255,255,.05); }

    .pod-avwrap { position: relative; width: 82px; height: 82px; }
    .pod-avatar { position: absolute; inset: 9px; border-radius: 50%; overflow: hidden;
      background: linear-gradient(135deg, hsl(var(--bh,210),58%,56%), hsl(var(--bh,210),50%,40%));
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 19px; color: rgba(255,255,255,.92); }
    .pod-avatar.has-avatar { color: transparent; }
    .pod.active .pod-avatar { animation: pod-breathe 2.2s ease-in-out infinite; }
    .pod-p1.active .pod-avatar { box-shadow: 0 0 22px -2px #4fd1c5, 0 0 0 1px #4fd1c5; }
    .pod-p2.active .pod-avatar { box-shadow: 0 0 22px -2px #ff8c42, 0 0 0 1px #ff8c42; }
    @keyframes pod-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }

    .clock-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); opacity: 0; transition: opacity .3s; }
    .pod.active .clock-ring { opacity: 1; }
    .cr-track { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 5; }
    .cr-fill { fill: none; stroke: #4fd1c5; stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 283; stroke-dashoffset: 283; transition: stroke-dashoffset .25s linear; }
    .pod-p2 .cr-fill { stroke: #ff8c42; }
    .pod.urgent .cr-fill { stroke: #e74c3c; }
    .clock-num { position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%); min-width: 16px;
      font-size: 11px; font-weight: 800; font-variant-numeric: tabular-nums;
      background: rgba(8,12,18,.9); padding: 1px 6px; border-radius: 9px; }
    .pod.active.urgent .clock-num { color: #ff6b5b; animation: urgent-pulse .7s ease-in-out infinite; }
    @keyframes urgent-pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

    .pod-name { margin-top: 9px; font-size: 16px; font-weight: 800; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pod-elo { font-size: 11px; opacity: .5; }
    .pod-score { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .pod-p1.lead .pod-score { color: #4fd1c5; }
    .pod-p2.lead .pod-score { color: #ff8c42; }
    .pod-state { font-size: 10px; font-weight: 800; letter-spacing: 1px; min-height: 14px; margin-top: 3px; text-transform: uppercase; }
    .pod-p1.active .pod-state { color: #4fd1c5; }
    .pod-p2.active .pod-state { color: #ff8c42; }
    .dots { display: inline-flex; gap: 2px; margin-left: 5px; vertical-align: middle; }
    .dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .3; animation: dot 1.2s infinite; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

    .cockpit.simulating .pod { opacity: .4; }

    /* ── Live "tale of the tape" cutaway (fades over the bracket) ──────────── */
    .bracket-panel { position: relative; }
    .tape { position: absolute; inset: 0; border-radius: 16px; padding: 22px;
      background: linear-gradient(160deg, rgba(13,21,33,.97), rgba(8,12,18,.99));
      display: flex; flex-direction: column; justify-content: center; gap: 4px;
      opacity: 0; pointer-events: none; transform: scale(.98); transition: opacity .5s ease, transform .5s ease; z-index: 5; }
    .tape.show { opacity: 1; transform: scale(1); }
    .tape-head { text-align: center; font-size: 12px; letter-spacing: 3px; font-weight: 800; opacity: .55; }
    .tape-fighters { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 12px; }
    .tape-fighter { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .tape-fighter.tape-f2 { justify-content: flex-end; }
    .tape-ava { width: 46px; height: 46px; border-radius: 50%; flex: none; background-size: cover; background-position: center;
      background: linear-gradient(135deg, hsl(var(--bh,210),58%,56%), hsl(var(--bh,210),50%,40%)); }
    .tape-name { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tape-vs { font-size: 13px; font-weight: 800; opacity: .4; flex: none; }
    .tape-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.07); }
    .tape-label { font-size: 10px; letter-spacing: 1.5px; opacity: .5; font-weight: 700; white-space: nowrap; }
    .tape-v { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; opacity: .6; }
    .tape-v.tape-v2 { text-align: left; }
    .tape-lead { opacity: 1; color: #4fd1c5; }
    .tape-v2.tape-lead { color: #ff8c42; }
    .tape-noh2h { text-align: center; opacity: .5; font-style: italic; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.07); }

    /* board takes the spotlight while the ecosystem resolves */
    .board-panel { position: relative; }
    .board-panel.resolving { box-shadow: inset 0 0 0 1px rgba(120,200,255,.25), 0 0 44px -12px rgba(120,200,255,.4); }
    .board-panel.resolving::after { content: 'RESOLVING'; position: absolute; top: 14px; right: 16px;
      font-size: 10px; letter-spacing: 2px; font-weight: 800; color: #9fd0ff; animation: sim-pulse 1.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .pod.active .pod-avatar, .dots i, .ck-ph-sim, .board-panel.resolving::after, .pod.active.urgent .clock-num { animation: none; }
    }

    /* Live trash-talk — fighting-game corner callouts. P1 fires from the left,
       P2 from the right; the latest shot stays lit, and a new line slams in. */
    .hero-banter { margin-top: 13px; display: flex; flex-direction: column; gap: 9px; }
    .taunt {
      position: relative; max-width: 88%; padding: 8px 13px; border-radius: 13px;
      font-size: 13px; line-height: 1.34;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(2px);
    }
    .taunt-p1 { align-self: flex-start; border-left: 3px solid #4fd1c5; transform-origin: left bottom; }
    .taunt-p2 { align-self: flex-end; text-align: right; border-right: 3px solid #ff8c42; transform-origin: right bottom; }
    .taunt-who { display: block; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px; }
    .taunt-p1 .taunt-who { color: #4fd1c5; }
    .taunt-p2 .taunt-who { color: #ff8c42; }
    .taunt-say { font-style: italic; opacity: .94; }
    .taunt-say::before { content: '“'; opacity: .5; }
    .taunt-say::after  { content: '”'; opacity: .5; }
    /* speech-bubble tail pointing up toward the fighter */
    .taunt::before { content: ''; position: absolute; top: -6px;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-bottom: 6px solid rgba(255,255,255,.07); }
    .taunt-p1::before { left: 18px; }
    .taunt-p2::before { right: 18px; }

    /* the most recent speaker: brighter + a hue-tinted glow so the eye tracks it */
    .taunt-latest { background: rgba(255,255,255,.085); }
    .taunt-latest.taunt-p1 { box-shadow: -5px 4px 22px -8px #4fd1c5; border-left-color: #6ee7db; }
    .taunt-latest.taunt-p2 { box-shadow: 5px 4px 22px -8px #ff8c42; border-right-color: #ffb27a; }

    /* SLAM: only on a genuinely new line (class added by render diff) */
    .taunt-new.taunt-p1 { animation: taunt-slam-l .42s cubic-bezier(.18,1.4,.4,1) both; }
    .taunt-new.taunt-p2 { animation: taunt-slam-r .42s cubic-bezier(.18,1.4,.4,1) both; }
    @keyframes taunt-slam-l {
      0%   { opacity: 0; transform: translateX(-26px) scale(.82) rotate(-1.5deg); }
      55%  { opacity: 1; transform: translateX(0) scale(1.05) rotate(.5deg); }
      100% { transform: translateX(0) scale(1) rotate(0); }
    }
    @keyframes taunt-slam-r {
      0%   { opacity: 0; transform: translateX(26px) scale(.82) rotate(1.5deg); }
      55%  { opacity: 1; transform: translateX(0) scale(1.05) rotate(-.5deg); }
      100% { transform: translateX(0) scale(1) rotate(0); }
    }
    /* impact flash ring on the slam */
    .taunt-new::after { content: ''; position: absolute; inset: -1px; border-radius: 13px;
      pointer-events: none; animation: taunt-flash .5s ease-out both; }
    .taunt-new.taunt-p1::after { box-shadow: 0 0 0 2px #4fd1c5 inset, 0 0 18px 2px #4fd1c5; }
    .taunt-new.taunt-p2::after { box-shadow: 0 0 0 2px #ff8c42 inset, 0 0 18px 2px #ff8c42; }
    @keyframes taunt-flash { 0% { opacity: .85; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .taunt-new.taunt-p1, .taunt-new.taunt-p2 { animation: none; }
      .taunt-new::after { animation: none; display: none; }
    }

    /* Bracket area is a "camera viewport": the tree is scaled/panned to fit. */
    .bracket-scroll { flex: 1; min-height: 0; position: relative; overflow: hidden; }
    #spec-bracket, #spec-lastbracket { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    #spec-bracket { transition: transform 1.5s cubic-bezier(.33, 0, .2, 1); }

    /* ── Idle analytics dashboard (native, broadcast-styled) ──────────────── */
    .spec-body.idle { display: block; overflow-y: auto; overflow-x: hidden; }
    .dash { display: flex; flex-direction: column; gap: var(--spec-gap); }
    .dash-highlights { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .dh-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
      background: linear-gradient(120deg, hsla(var(--bh,210),55%,42%,.16), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.08); }
    .dh-ic { font-size: 26px; line-height: 1; }
    .dh-clabel { font-size: 10px; letter-spacing: 1.5px; opacity: .55; font-weight: 800; }
    .dh-cname { display: flex; align-items: center; gap: 7px; font-size: 17px; font-weight: 800; margin: 2px 0; }
    .dh-cdetail { font-size: 11px; opacity: .6; }

    .dash-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      grid-template-areas: "chart standings" "h2h standings"; gap: var(--spec-gap); }
    .dash-chart-panel { grid-area: chart; } .dash-standings-panel { grid-area: standings; } .dash-h2h-panel { grid-area: h2h; }
    .dash-chart { width: 100%; height: auto; max-height: 360px; }
    .dh-grid { stroke: rgba(255,255,255,.06); }
    .dh-grid-base { stroke: rgba(255,255,255,.16); }
    .dh-axis-label, .dh-axis-title { fill: rgba(255,255,255,.4); font-size: 11px; }
    .dh-end { font-size: 11px; font-weight: 700; }

    /* avatars — gradient (or portrait) chips, like the bracket badges */
    .dh-ava { display: inline-block; flex: none; border-radius: 6px; width: 22px; height: 22px;
      background: linear-gradient(135deg, hsl(var(--bh,210),58%,56%), hsl(var(--bh,210),50%,40%)); background-size: cover; background-position: center; }
    .dh-ava-sm { width: 20px; height: 20px; } .dh-ava-xs { width: 15px; height: 15px; }
    .dh-ava.has-avatar { color: transparent; }

    .dash-lb-scroll { overflow: auto; max-height: 380px; }
    .dash-lb { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dash-lb th { text-align: left; font-size: 10px; letter-spacing: 1px; opacity: .4; padding: 4px 6px; position: sticky; top: 0; background: #0d1521; }
    .dash-lb td { padding: 6px 6px; border-top: 1px solid rgba(255,255,255,.04); }
    .dh-lb-rank { width: 22px; font-weight: 800; opacity: .7; }
    .dh-lb-model { display: flex; align-items: center; gap: 8px; }
    .dh-lb-id b { font-weight: 700; } .dh-lb-id i { display: block; font-style: normal; font-size: 10px; opacity: .45; }
    .dh-lb-elo { font-weight: 800; font-variant-numeric: tabular-nums; }
    .dh-lb-wl, .dh-lb-wr { font-variant-numeric: tabular-nums; opacity: .8; }
    .dh-sw { color: #2ecc71; font-weight: 700; } .dh-sl { color: #e74c3c; font-weight: 700; }
    .dh-empty { padding: 24px; text-align: center; opacity: .4; }

    .dash-h2h { overflow: auto; }
    .dh-h2h-table { border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
    .dh-h2h-table th, .dh-h2h-table td { padding: 3px 5px; text-align: center; }
    .dh-h2h-row { display: flex; align-items: center; gap: 5px; white-space: nowrap; opacity: .8; }
    .dh-h2h-cell { border-radius: 4px; font-weight: 700; min-width: 30px; }
    .dh-h2h-self { background: rgba(255,255,255,.04); }
    .dh-h2h-none { opacity: .2; }

    /* Recent-results ticker */
    .spec-ticker { flex: none; display: flex; gap: 10px; overflow: hidden; align-items: center; }
    .spec-ticker .tk-label { font-size: 11px; letter-spacing: 2px; opacity: .45; flex: none; }
    .tk-list { display: flex; gap: 8px; overflow: hidden; }
    .tk-item { flex: none; font-size: 12px; padding: 6px 11px; border-radius: 999px; background: rgba(255,255,255,.05); white-space: nowrap; }
    .tk-item b { color: #4fd1c5; }
    .tk-item .tk-loser { opacity: .5; }
    .tk-item .tk-sc { opacity: .4; font-variant-numeric: tabular-nums; margin-left: 6px; }

    /* ══ Cinematic event scenes — match win & tournament champion ═══════════
       Full-screen overlays the spectator fires when a bracket match resolves
       (winner reveal) or the tournament is decided (champion crowning). The
       winner's video avatar takes centre stage on the shared .event-stage
       aurora; spark volleys punctuate the beat. Independent of the live/idle
       body so it plays out cleanly even as the feed transitions underneath. */
    .spec-event {
      position: fixed; inset: 0; z-index: 200;
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .5s ease;
    }
    .spec-event.show { opacity: 1; }
    .se-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; text-align: center; padding: 24px; box-sizing: border-box;
    }

    .se-kicker {
      font-size: 13px; letter-spacing: 4px; font-weight: 800; text-transform: uppercase;
      color: rgba(255,255,255,.55);
      opacity: 0; animation: se-rise .6s ease .15s both;
    }

    /* Winner avatar — hero-sized video portrait (procedural hue+initials fallback). */
    .se-ava {
      position: relative; width: 230px; height: 230px; border-radius: 50%;
      overflow: hidden; flex: none; margin-top: 6px;
      background: linear-gradient(135deg, hsl(var(--bh,210),58%,56%), hsl(var(--bh,210),50%,40%));
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center;
      font-size: 66px; font-weight: 800; color: rgba(255,255,255,.92);
      box-shadow: 0 0 0 3px rgba(255,255,255,.14), 0 26px 80px -20px rgba(0,0,0,.85);
      opacity: 0; animation: se-pop .85s cubic-bezier(.2,.9,.3,1.3) .05s both;
    }
    .se-ava.has-avatar { color: transparent; }
    .se-ava video.avatar-clip, .se-ava canvas.avatar-clip-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .se-ava::after {
      content: ''; position: absolute; inset: -7px; border-radius: 50%;
      border: 2px solid var(--se-glow, #4fd1c5); pointer-events: none;
      box-shadow: 0 0 30px -2px var(--se-glow, #4fd1c5);
      animation: se-ring 2.4s ease-in-out infinite;
    }

    .se-ribbon {
      margin-top: 14px; font-size: 12px; letter-spacing: 3px; font-weight: 800;
      padding: 5px 17px; border-radius: 999px; text-transform: uppercase;
      background: var(--se-glow,#4fd1c5); color: #06121a;
      opacity: 0; animation: se-pop .6s cubic-bezier(.2,.9,.3,1.3) .7s both;
    }
    .se-name {
      font-size: 46px; font-weight: 800; letter-spacing: .5px; margin-top: 10px; line-height: 1.05;
      color: #fff; text-shadow: 0 2px 34px var(--se-glow, rgba(79,209,197,.5));
      opacity: 0; animation: se-rise .6s ease .3s both;
    }
    .se-defeats { font-size: 16px; color: rgba(255,255,255,.6); opacity: 0; animation: se-rise .6s ease .45s both; }
    .se-defeats s { color: rgba(255,255,255,.85); text-decoration-thickness: 2px; }
    .se-score {
      font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 8px;
      letter-spacing: 2px; color: var(--se-glow,#4fd1c5);
      opacity: 0; animation: se-rise .6s ease .6s both;
    }

    /* Champion — gold aurora override + a crown above the portrait. */
    .se-champ {
      --aur-1: hsl(45,100%,60%); --aur-2: hsl(32,95%,54%); --aur-glow: hsla(42,100%,52%,.26);
      --se-glow: #ffd86b;
    }
    .se-crown { font-size: 72px; line-height: 1; opacity: 0;
      filter: drop-shadow(0 6px 26px rgba(255,200,80,.6));
      animation: se-drop .85s cubic-bezier(.2,.9,.3,1.3) both; }
    .se-champ .se-ava { width: 290px; height: 290px; }
    .se-champ .se-name {
      font-size: 58px; margin-top: 14px;
      background: linear-gradient(180deg,#fff,#ffe6a3); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .se-record { font-size: 15px; letter-spacing: 1px; color: rgba(255,255,255,.72); opacity: 0; animation: se-rise .6s ease .5s both; }
    .se-path { font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,.45); margin-top: 8px; max-width: 80vw; opacity: 0; animation: se-rise .6s ease .65s both; }

    @keyframes se-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes se-pop  { 0% { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.06); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes se-drop { 0% { opacity: 0; transform: translateY(-30px) scale(.6); } 60% { opacity: 1; transform: translateY(0) scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes se-ring { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) {
      .se-kicker,.se-ava,.se-name,.se-defeats,.se-score,.se-ribbon,.se-crown,.se-record,.se-path { animation: none; opacity: 1; }
      .se-ava::after { animation: none; }
    }

    /* ── Mobile: stack into a single scrolling column ────────────────────── */
    @media (max-width: 720px) {
      html, body { height: auto; }
      body { overflow-x: hidden; overflow-y: auto; }
      .spec { height: auto; min-height: 100dvh; padding: 12px; gap: 12px; }

      .spec-title { font-size: 18px; }
      .spec-sub { font-size: 11px; }

      /* Grid → flex column; lead with the live match, then board, then bracket. */
      .spec-body, .spec-body.live, .spec-body.idle {
        display: flex; flex-direction: column; gap: 12px; flex: none;
      }
      .spec-body.live .hero-card { order: 1; }
      .spec-body.live .board-panel { order: 2; }
      .spec-body.live .bracket-panel { order: 3; }
      .spec-body.idle .standings-panel { order: 1; }
      .spec-body.idle .champ-panel { order: 2; }

      .panel { padding: 13px; }
      /* Board fills the width, capped so it never eats the whole screen. */
      .board-wrap { min-height: 0; }
      #board-img { width: 100%; max-width: 100%; max-height: 52vh; }
      .board-empty { padding: 28px 0; }

      /* Phones keep a natural scroll — no camera (the transform would shrink
         the tree to thumbnail size). Undo the absolute/transform layer. */
      .bracket-scroll { max-height: 62vh; overflow: auto; position: static; -webkit-overflow-scrolling: touch; }
      #spec-bracket, #spec-lastbracket { position: static; transform: none !important; transition: none; }

      /* Dashboard stacks to one column and grows the page. */
      .spec-body.idle { display: block; }
      .dash-grid { grid-template-columns: 1fr; grid-template-areas: "chart" "standings" "h2h"; }
      .dash-chart { max-height: none; }
      .dash-lb-scroll { max-height: none; }

      /* Bigger, legible hero on the phone. */
      .hero-name { font-size: 18px; }
      .hero-score { font-size: 28px; }

      /* Cockpit on a phone — compact pods, still legible. */
      .cockpit { gap: 4px; margin-top: 10px; }
      .pod-avwrap { width: 66px; height: 66px; }
      .pod-avatar { inset: 7px; font-size: 16px; }
      .cr-track, .cr-fill { stroke-width: 6; }
      .pod-name { font-size: 14px; margin-top: 7px; }
      .pod-score { font-size: 22px; }
      .cockpit-vs { font-size: 11px; }

      /* Taunts read as a full-width duel on a phone — punchier text, more reach. */
      .hero-banter { gap: 10px; }
      .taunt { max-width: 92%; font-size: 14px; padding: 9px 14px; }
      .taunt-who { font-size: 10.5px; }

      /* Recent ticker swipes horizontally instead of clipping. */
      .spec-ticker { overflow: hidden; }
      .tk-list { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }

      /* Event scenes scale down for the phone. */
      .se-ava { width: 160px; height: 160px; font-size: 48px; }
      .se-champ .se-ava { width: 190px; height: 190px; }
      .se-name { font-size: 34px; }
      .se-champ .se-name { font-size: 40px; }
      .se-crown { font-size: 56px; }
      .se-score { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="spec">
    <div class="spec-top">
      <div>
        <div class="spec-title">BIOME <b>·</b> LIVE</div>
        <div class="spec-sub" id="spec-sub">ecosystem tournament</div>
      </div>
      <div class="spec-pill off" id="spec-pill"><span class="spec-dot"></span><span id="spec-pill-text">connecting…</span></div>
    </div>

    <div class="spec-body" id="spec-body"><!-- filled by spectator.js --></div>

    <div class="spec-ticker">
      <span class="tk-label">RECENT</span>
      <div class="tk-list" id="spec-ticker"></div>
    </div>
  </div>

  <!-- Cinematic event layer — fired by spectator.js on a match win / champion crowning. -->
  <div class="spec-event" id="spec-event" aria-hidden="true"></div>

  <script type="module" src="js/spectator.js"></script>
</body>
</html>
